<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seiha Stamp Passport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Conquer Japan one stamp at a time. Mark the places you've been on a blank map and collect food and activity stamps in every prefecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+2:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 1カラム。ヘッダー → (ホーム) 集計＋白地図＋地方別 / (県) 都市ごとのスタンプ / (スタンプ帳) / (アカウント)
   駅スタンプ帳がモチーフ：パスポート紙のような冷たい白、食＝朱、アクティビティ＝藍のインク */
:root {
  --paper: #f2f3ef;
  --panel: #ffffff;
  --ink: #1c2230;
  --muted: #5b6370;
  --rule: #d6d9d2;
  --sea: #dfe7ea;
  --land: #ffffff;
  --coast: #8a94a1;
  --food: #c13a22;
  --act: #2a58a3;
  --visit: #f1c6bb;
  --conq: #c13a22;
  --gold: #a87b1f;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "M PLUS 2", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* 白地図が主役なので、端末がダークモードでも常に明るい配色で表示する */
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: .01em; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ヘッダー */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; margin-right: auto; }
.logo b { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; letter-spacing: .04em; }
.logo span { font-size: .72rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav a, .nav button { text-decoration: none; font-size: .88rem; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--muted); }
.nav a[aria-current="page"] { color: var(--ink); border-color: var(--rule); background: var(--panel); }
.nav .lang { border-color: var(--rule); font-family: var(--f-num); font-size: .78rem; }
.chip-demo { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 0 6px; }

/* ホーム：集計 */
.hero { padding-block: 32px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 32px; align-items: end; }
.hero h1 { font-size: clamp(1.9rem, 5.2vw, 3.1rem); }
.hero h1 em { font-style: normal; color: var(--conq); }
.hero p { margin: 10px 0 0; color: var(--muted); max-width: 36em; }
.tally { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; text-align: right; }
.tally .big { font-family: var(--f-num); font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; line-height: 1; }
.tally .big small { font-size: .45em; color: var(--muted); font-weight: 500; }
.tally .lbl { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bars { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
.bar { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .82rem; }
.bar i { display: block; height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.bar i span { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .5s ease; }
.bar.food i span { background: var(--food); } .bar.act i span { background: var(--act); }
.bar .tag { font-weight: 700; } .bar.food .tag { color: var(--food); } .bar.act .tag { color: var(--act); }
@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .tally { text-align: left; }
  .bars { grid-template-columns: 1fr; }
}

.notice { margin-top: 18px; padding: 10px 14px; border: 1px dashed var(--rule); border-radius: 6px; font-size: .86rem; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.notice a { color: var(--act); font-weight: 700; }

/* 白地図 */
.section { padding-block: 24px; }
.section > h2, .sec-head h2 { font-size: 1.3rem; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--coast); vertical-align: -1px; margin-right: 5px; background: var(--land); border-radius: 2px; }
.legend i.v { background: var(--visit); } .legend i.c { background: var(--conq); border-color: var(--conq); }
.btn-ghost { background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: .8rem; }
.stage { --head-h: 56px; height: calc(100vh - var(--head-h) - env(safe-area-inset-top, 0px)); height: calc(100svh - var(--head-h) - env(safe-area-inset-top, 0px)); min-height: 420px; max-height: 920px; display: flex; flex-direction: column; background: var(--sea); border-bottom: 1px solid var(--rule); }
.map-scroll { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.map-box { position: absolute; inset: 0; }
.map-status { padding: 80px 16px; text-align: center; color: var(--muted); }
.jmap { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.jmap.is-drag { cursor: grabbing; }
.ov-count { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: .8rem; pointer-events: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .06); }
.ov-count b { font-family: var(--f-num); font-size: 1rem; color: var(--conq); }
.zoom-btns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 6px; }
.zoom-btns button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); font-family: var(--f-num); font-size: 1.15rem; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .06); }
.stage-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--paper); border-top: 1px solid var(--rule); font-size: .78rem; color: var(--muted); }
.stage-bar a { color: var(--muted); text-decoration: none; white-space: nowrap; }
.jmap-pref { fill: var(--land); stroke: var(--coast); stroke-width: .7; stroke-linejoin: round; cursor: pointer; transition: fill .3s; }
.jmap-pref.is-visited { fill: var(--visit); }
.jmap-pref.is-conq { fill: var(--conq); }
.jmap-pref { vector-effect: non-scaling-stroke; }
.jmap-pref:hover, .jmap-pref:focus-visible { stroke: var(--ink); stroke-width: 1.6; outline: none; }
.jmap-inset { fill: none; stroke: var(--coast); stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
@media (max-width: 560px) {
  .logo span { display: none; }
  .chip-demo { display: none; }
  .nav a, .nav button { padding: 3px 8px; font-size: .82rem; }
  .top .wrap { flex-wrap: nowrap; }
}
.map-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: .78rem; padding: 3px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -130%); }

/* 地方別 */
.regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.region { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.region h3 { font-size: 1rem; display: flex; justify-content: space-between; gap: 8px; }
.region h3 .num { font-family: var(--f-num); font-size: .8rem; color: var(--muted); }
.prefs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pchip { text-decoration: none; font-size: .82rem; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: baseline; background: var(--paper); }
.pchip .num { font-size: .72rem; color: var(--muted); }
.pchip.is-visited { background: var(--visit); border-color: transparent; }
.pchip.is-conq { background: var(--conq); color: #fff; border-color: transparent; }
.pchip.is-conq .num { color: #fff; opacity: .85; }

/* 県ページ */
.crumb { padding-top: 22px; font-size: .85rem; color: var(--muted); }
.crumb a { text-decoration: none; }
.pref-head { padding-block: 8px 4px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
.pref-head h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
.pref-head h1 small { font-family: var(--f-body); font-size: .4em; color: var(--muted); margin-left: 10px; font-weight: 500; }
.seal { font-family: var(--f-display); color: var(--conq); border: 3px double var(--conq); border-radius: 6px; padding: 4px 10px; transform: rotate(-6deg); font-size: 1rem; white-space: nowrap; }
.cities { display: grid; gap: 18px; padding-block: 18px 40px; }
.city { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; min-width: 0; }
.city-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.city-head h2 { font-size: 1.15rem; }
.city-head h2 small { font-family: var(--f-body); font-size: .75em; color: var(--muted); margin-left: 6px; }
.group-head { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 10px; }
.group-head h2 { font-size: 1.15rem; }
.group-head.food h2 { color: var(--food); } .group-head.activity h2 { color: var(--act); }
.exp .city-tag { display: inline-block; font-size: .72rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 0 8px; margin-bottom: 4px; }
.exps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.exp { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; background: none; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.exp:hover { border-color: var(--muted); }
.exp.food { --ink-c: var(--food); } .exp.activity { --ink-c: var(--act); }
.exp h3 { font-family: var(--f-body); font-weight: 700; font-size: .98rem; line-height: 1.35; }
.exp h3 small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
.exp p { margin: 4px 0 0; font-size: .82rem; color: var(--muted); line-height: 1.5; }
.exp .act-line { margin-top: 6px; font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-c); }

/* スタンプ（駅スタンプ風の丸印） */
.stamp { --tilt: -8deg; width: 84px; aspect-ratio: 1; border-radius: 50%; display: grid; grid-template-rows: auto 1fr auto; place-items: center; padding: 10px 6px 8px; border: 2px dashed var(--rule); color: var(--muted); line-height: 1; user-select: none; }
.stamp .t { font-size: .55rem; letter-spacing: .14em; font-weight: 700; }
.stamp .k { font-family: var(--f-display); font-size: 1.7rem; opacity: .35; }
.stamp .d { font-family: var(--f-num); font-size: .5rem; letter-spacing: .02em; }
.is-on .stamp { border: 3px solid var(--ink-c); color: var(--ink-c); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4.5px var(--ink-c); transform: rotate(var(--tilt)); }
.is-on .stamp .k { opacity: 1; }
.exp.is-on { border-color: color-mix(in srgb, var(--ink-c) 40%, var(--rule)); }
.just .stamp { animation: thump .45s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes thump { 0% { transform: scale(1.5) rotate(var(--tilt)); opacity: 0; } 60% { transform: scale(.94) rotate(var(--tilt)); opacity: 1; } 100% { transform: scale(1) rotate(var(--tilt)); } }

/* スタンプ帳 */
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 22px 14px; padding-block: 18px 40px; }
.book .item { display: grid; justify-items: center; gap: 6px; text-align: center; text-decoration: none; }
.book .item.food { --ink-c: var(--food); } .book .item.activity { --ink-c: var(--act); }
.book .stamp { width: 96px; }
.book .item:nth-child(3n) .stamp { --tilt: 5deg; } .book .item:nth-child(3n+1) .stamp { --tilt: -4deg; }
.book .name { font-size: .82rem; font-weight: 700; line-height: 1.35; }
.book .where { font-size: .72rem; color: var(--muted); }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }
.empty a { color: var(--act); font-weight: 700; }
.seals { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.seals .seal { font-size: .85rem; text-decoration: none; }

/* アカウント */
.forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; padding-block: 18px 40px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; min-width: 0; }
.card h2 { font-size: 1.1rem; margin-bottom: 10px; }
.card label { display: block; font-size: .82rem; color: var(--muted); margin-top: 10px; }
.card input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); }
.btn { margin-top: 14px; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; font-weight: 700; }
.err { color: var(--food); font-size: .82rem; min-height: 1.2em; margin: 8px 0 0; }

/* トースト */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .88rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); z-index: 20; max-width: calc(100% - 32px); }
.toast.big { font-family: var(--f-display); font-size: 1.05rem; background: var(--conq); color: #fff; }
footer { border-top: 1px solid var(--rule); padding-block: 18px 28px; font-size: .78rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .just .stamp { animation: none; } .bar i span, .jmap-pref { transition: none; } }
</style>
</head>

      '<div class="bars">' +
        '<div class="bar food"><span class="tag">' + t("food") + '</span><i><span style="width:' + pct(tt.food, idx.totalFood) + '%"></span></i><span class="num">' + tt.food + "/" + idx.totalFood + "</span></div>" +
        '<div class="bar act"><span class="tag">' + t("activity") + '</span><i><span style="width:' + pct(tt.act, idx.totalAct) + '%"></span></i><span class="num">' + tt.act + "/" + idx.totalAct + "</span></div>" +
      "</div></section>" + note +
      '<section class="section"><h2 style="margin-bottom:12px">' + t("byRegion") + '</h2><div class="regions">' + regions + "</div></section></div>";
  }

  function viewPref(slug) {
    var p = S.idx.prefBySlug[slug];
    if (!p) return '<div class="wrap"><p class="empty">Not found. <a href="#home">' + t("back") + "</a></p></div>";
    var st = prefState(p);
    var groups = ["food", "activity"].map(function (cat) {
      var list = p.exps.filter(function (e) { return e.cat === cat; });
      var got = list.filter(function (e) { return S.stamps[e.id]; }).length;
      return '<section class="city"><div class="group-head ' + cat + '"><h2>' + (cat === "food" ? t("food") : t("activity")) + '</h2><span class="num muted">' + got + "/" + list.length + '</span></div><div class="exps">' +
        list.map(function (e) {
          var on = !!S.stamps[e.id], c = S.idx.cities[e.city];
          return '<button type="button" class="exp ' + e.cat + (on ? " is-on" : "") + (justStamped === e.id ? " just" : "") + '" data-act="stamp" data-id="' + esc(e.id) + '" aria-pressed="' + on + '">' +
            stampHtml(e) + '<span><span class="city-tag">' + esc(nm(c)) + "</span><h3>" + esc(nm(e)) + "<small>" + esc(sub(e)) + "</small></h3><p>" + esc(lang === "ja" ? e.dja : e.den) + '</p><div class="act-line">' +
            (on ? t("stamped") : t("stampIt")) + "</div></span></button>";
        }).join("") + "</div></section>";
    }).join("");
    return '<div class="wrap"><div class="crumb"><a href="#home">← ' + t("back") + "</a> / " + esc(nm(S.idx.regions.find(function (r) { return r.id === p.region; }))) + "</div>" +
      '<div class="pref-head"><h1>' + esc(nm(p)) + "<small>" + esc(sub(p)) + '</small></h1><div class="num" style="font-size:1.1rem">' + st.got + "/" + st.total + " " + t("stampsOf") +
      (st.conq ? ' &nbsp;<span class="seal">制覇 CONQUERED</span>' : "") + "</div></div>" +
      '<div class="cities">' + groups + "</div></div>";
  }

  function viewPassport() {
    var list = Object.keys(S.stamps).map(function (id) { return S.idx.exps[id]; }).filter(Boolean)
      .sort(function (a, b) { return S.stamps[a.id] < S.stamps[b.id] ? 1 : -1; });
    var conq = Object.keys(S.idx.prefs).map(function (k) { return S.idx.prefs[k]; }).filter(function (p) { return prefState(p).conq; });
    var body = list.length ? '<div class="book">' + list.map(function (e) {
      var c = S.idx.cities[e.city], p = S.idx.prefs[c.pref];
      return '<a class="item ' + e.cat + ' is-on" href="#pref-' + p.slug + '">' + stampHtml(e) + '<span class="name">' + esc(nm(e)) + '</span><span class="where">' + esc(nm(c)) + ", " + esc(nm(p)) + "</span></a>";
    }).join("") + "</div>" : '<p class="empty">' + t("bookEmpty") + ' <a href="#home">' + t("bookGo") + "</a></p>";
    return '<div class="wrap"><section class="hero" style="grid-template-columns:1fr"><div><h1>' + t("bookTitle") + "</h1><p class=\"num\">" + list.length + " / " + S.idx.total + " " + t("stampsOf") + "</p></div></section>" +
      (conq.length ? '<section class="section" style="padding-bottom:0"><h2>' + t("sealsTitle") + '</h2><div class="seals">' + conq.map(function (p) { return '<a class="seal" href="#pref-' + p.slug + '">' + esc(nm(p)) + " 制覇</a>"; }).join("") + "</div></section>" : "") +
      body + "</div>";
  }

  function viewAccount() {
    var head = '<div class="wrap"><section class="hero" style="grid-template-columns:1fr"><h1>' + t("account") + "</h1></section>";
    if (S.mode === "demo") return head + '<div class="card" style="margin-bottom:40px">' + t("demoAcc") + "</div></div>";
    if (S.mode === "user") return head + '<div class="card" style="margin-bottom:40px"><p style="margin:0">' + t("loggedAs") + " <b>" + esc(S.user.username) + '</b></p><button class="btn" type="button" data-act="logout">' + t("logout") + "</button></div></div>";
    var form = function (id, title, btn) {
      return '<form class="card" id="' + id + '"><h2>' + title + '</h2><label for="' + id + '-u">' + t("user") + '</label><input id="' + id + '-u" name="username" autocomplete="username" required pattern="[A-Za-z0-9_]{3,20}" title="' + t("userHint") + '">' +
        '<label for="' + id + '-p">' + t("pass") + '</label><input id="' + id + '-p" name="password" type="password" minlength="8" required autocomplete="' + (id === "fSignup" ? "new-password" : "current-password") + '">' +
        '<button class="btn" type="submit">' + btn + '</button><p class="err" id="' + id + '-err"></p></form>';
    };
    return head + '<div class="forms">' + form("fSignup", t("signup"), t("signupBtn")) + form("fLogin", t("login"), t("loginBtn")) + "</div></div>";
  }

  var lastView = "";
  function render() {
    var r = route(); renderNav(r);
    var html = r.v === "pref" ? viewPref(r.slug) : r.v === "passport" ? viewPassport() : r.v === "account" ? viewAccount() : viewHome();
    var view = $("#view"), key = r.v + (r.slug || "");
    var y = window.scrollY;
    view.innerHTML = html;
    if (key === lastView) window.scrollTo(0, y); else window.scrollTo(0, 0);
    lastView = key; justStamped = null;
    if (r.v === "home") {
      var hh = $(".top").getBoundingClientRect().height; $("#stage").style.setProperty("--head-h", Math.round(hh) + "px");
      JMap.mount($("#mapBox"), function (code) { var p = S.idx.prefs[code]; if (p) location.hash = "pref-" + p.slug; })
        .catch(function () { var b = $("#mapBox"); if (b) b.innerHTML = '<div class="map-status">' + t("mapFail") + "</div>"; });
    }
  }

  /* ---------- イベント ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act;
    if (act === "stamp") toggleStamp(b.dataset.id);
    else if (act === "zin") JMap.zoom(0.7);
    else if (act === "zout") JMap.zoom(1 / 0.7);
    else if (act === "zfit") JMap.fit();
    else if (act === "more") { e.preventDefault(); var st = $("#stats"); if (st) st.scrollIntoView({ behavior: "smooth" }); }
    else if (act === "lang") { lang = lang === "en" ? "ja" : "en"; LS.set(KEY_LANG, lang); render(); }
    else if (act === "logout") { api("POST", "/api/logout").finally(function () { S.mode = "guest"; S.user = null; S.visits = {}; S.stamps = {}; location.hash = "home"; render(); }); }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target; if (f.id !== "fSignup" && f.id !== "fLogin") return;
    e.preventDefault();
    var err = $("#" + f.id + "-err"); err.textContent = "";
    var body = { username: f.username.value.trim(), password: f.password.value };
    var guest = { visits: Object.keys(S.visits).map(function (k) { return { city: k, at: S.visits[k] }; }), stamps: Object.keys(S.stamps).map(function (k) { return { exp: k, at: S.stamps[k] }; }) };
    var hadGuest = guest.visits.length + guest.stamps.length > 0;
    api("POST", f.id === "fSignup" ? "/api/signup" : "/api/login", body)
      .then(function (d) { S.user = { username: d.username }; S.mode = "user"; return hadGuest ? api("POST", "/api/import", guest) : api("GET", "/api/progress"); })
      .then(function (p) { fromRows(p); LS.del(KEY_PROGRESS); if (hadGuest) toast(t("synced")); location.hash = "home"; render(); })
      .catch(function (x) { err.textContent = x.message; });
  });
  window.addEventListener("hashchange", render);

  /* ---------- 起動 ---------- */
  async function boot() {
    var cat = window.DEMO_CATALOG || null;
    if (cat) S.mode = "demo";
    else {
      try { cat = await api("GET", "/api/catalog"); } catch (e) { $("#view").innerHTML = '<div class="wrap"><p class="empty">Could not load data.</p></div>'; return; }
      try { var me = await api("GET", "/api/me"); S.user = me; S.mode = "user"; fromRows(await api("GET", "/api/progress")); } catch (e) { S.mode = "guest"; }
    }
    S.idx = buildIndex(cat);
    if (S.mode !== "user") { var p = LS.get(KEY_PROGRESS, {}); S.visits = p.visits || {}; S.stamps = p.stamps || {}; }
    render();
  }
  boot();
})();
</script>
</body>
</html>
